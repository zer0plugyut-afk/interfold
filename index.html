<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07141a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f7f4" media="(prefers-color-scheme: light)" />

    <title>Interfold Board</title>
    <meta
      name="description"
      content="Community analytics for The Interfold — operators, live on-chain events, charts, tokenomics, and CRISP."
    />
    <meta name="application-name" content="Interfold Board" />
    <meta name="author" content="Interfold Board community" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://interfoldboard.app/" />

    <!-- Favicons / PWA -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/apple-touch-icon.png" type="image/png" sizes="180x180" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Interfold Board" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="msapplication-TileColor" content="#07141a" />

    <!-- Open Graph — absolute URLs required for Discord / Slack / X previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://interfoldboard.app/" />
    <meta property="og:site_name" content="Interfold Board" />
    <meta property="og:title" content="Interfold Board" />
    <meta
      property="og:description"
      content="Community analytics for The Interfold — operators, live on-chain events, charts, tokenomics, and CRISP."
    />
    <meta property="og:image" content="https://interfoldboard.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://interfoldboard.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Interfold Board — community analytics" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X large card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Interfold Board" />
    <meta
      name="twitter:description"
      content="Community analytics for The Interfold — operators, live on-chain events, charts, tokenomics, and CRISP."
    />
    <meta name="twitter:image" content="https://interfoldboard.app/og-image.png" />
    <meta name="twitter:image:alt" content="Interfold Board — community analytics" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
